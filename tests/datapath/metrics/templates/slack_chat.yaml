# Reusable Slack member-analytics records (bronze_slack.users_details). The base
# lists EVERY schema field; a test sets the member, the day and the counters.
templates:
  slack_user_day:
    _airbyte_raw_id: "00000000-0000-0000-0000-000000000000"
    _airbyte_extracted_at: "2030-01-01T00:00:00"
    _airbyte_meta: "{}"
    _airbyte_generation_id: 0
    unique_key: null
    insight_tenant_id: "{{ tenant }}"
    insight_source_id: "slack-test"
    date: null
    team_id: T0000000001
    user_id: null
    email_address: null
    is_guest: false
    is_billable_seat: true
    is_active: true
    is_active_ios: false
    is_active_android: false
    is_active_desktop: true
    is_active_apps: false
    is_active_workflows: false
    is_active_slack_connect: false
    reactions_added_count: 0
    messages_posted_count: null
    channel_messages_posted_count: null
    files_added_count: 0
    total_calls_count: 0
    slack_calls_count: 0
    slack_huddles_count: 0
    search_count: 0
    date_claimed: null

  # bronze_slack.users: one member from users.list.
  slack_member:
    _airbyte_raw_id: "00000000-0000-0000-0000-000000000000"
    _airbyte_extracted_at: "2030-01-01T00:00:00"
    _airbyte_meta: "{}"
    _airbyte_generation_id: 0
    unique_key: null
    insight_tenant_id: "{{ tenant }}"
    insight_source_id: "slack-test"
    user_id: null
    real_name: null
    display_name: null
    deleted: false
    email: null
    is_restricted: false
    is_ultra_restricted: false
    is_bot: false

  # bronze_slack.messages: one message from conversations.history or conversations.replies.
  slack_message:
    _airbyte_raw_id: "00000000-0000-0000-0000-000000000000"
    _airbyte_extracted_at: "2030-01-01T00:00:00"
    _airbyte_meta: "{}"
    _airbyte_generation_id: 0
    unique_key: null
    insight_tenant_id: "{{ tenant }}"
    insight_source_id: "slack-test"
    channel_id: C001
    channel_type: public_channel
    ts: null
    date: null
    thread_ts: null
    user_id: null
    bot_id: null
    subtype: null
    reply_count: null
    text_length: 10
    link_count: 0
    file_count: 0
    attachment_count: 0
