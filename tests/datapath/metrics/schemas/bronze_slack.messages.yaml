# Reusable JSON schema for the table (all real fields). Resolved by table name.
# Mirrors the bronze_slack.messages table destination-clickhouse creates.
schemas:
  bronze_slack.messages:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    additionalProperties: false
    properties:
      _airbyte_raw_id: {type: string}
      _airbyte_extracted_at: {type: string, format: date-time}
      _airbyte_meta: {type: string}
      _airbyte_generation_id: {type: integer}
      unique_key: {type: string}
      insight_tenant_id: {type: string}
      insight_source_id: {type: string}
      channel_id: {type: string}
      channel_type: {type: [string, "null"]}
      ts: {type: string}
      date: {type: string}
      thread_ts: {type: [string, "null"]}
      user_id: {type: [string, "null"]}
      bot_id: {type: [string, "null"]}
      subtype: {type: [string, "null"]}
      reply_count: {type: [integer, "null"]}
      text_length: {type: [integer, "null"]}
      link_count: {type: [integer, "null"]}
      file_count: {type: [integer, "null"]}
      attachment_count: {type: [integer, "null"]}
