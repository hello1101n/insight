# Reusable JSON schema for the table (all real fields). Resolved by table name.
# Mirrors the bronze_slack.users table destination-clickhouse creates.
schemas:
  bronze_slack.users:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    additionalProperties: false
    properties:
      _airbyte_raw_id: {type: string}
      _airbyte_extracted_at: {type: string, format: date-time}
      _airbyte_meta: {type: string}
      _airbyte_generation_id: {type: integer}
      unique_key: {type: string}
      insight_tenant_id: {type: string}
      insight_source_id: {type: string}
      user_id: {type: string}
      real_name: {type: [string, "null"]}
      display_name: {type: [string, "null"]}
      deleted: {type: [boolean, "null"]}
      email: {type: [string, "null"]}
      is_restricted: {type: [boolean, "null"]}
      is_ultra_restricted: {type: [boolean, "null"]}
      is_bot: {type: [boolean, "null"]}
