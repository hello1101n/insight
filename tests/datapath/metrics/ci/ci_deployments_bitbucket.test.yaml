description: >
  Metric: ci.deployments — deployments created, outcome folded from the latest
  state, from Bitbucket Deployments (tenant-grain).
  How it's computed (bronze → silver → gold):
    • bronze: Bitbucket deployments, one row per deployment holding its latest
      state, with its environment's name and type; re-sync duplicates possible
    • silver: the deployment, and one event per state version a sync observed;
      a deployment still UNDEPLOYED is a placeholder for a manual step that has
      not run and is left out of both
    • gold:   each deployment takes its latest event as outcome; the
      environment type Production is the production split, every other type
      is static (Bitbucket has no preview environments)

  Seeded: a successful production deployment (plus an exact re-sync
  duplicate), a failed staging deployment, an in-progress test deployment, a
  stopped production deployment, an UNDEPLOYED production placeholder and a
  successful deployment stored before connector 7.11.0, which has no
  environment and appears nowhere until a sync reads it again →
  4 deployments: success 1, failure 1, in_progress 1, cancelled 1, none
  pending; production 2, static 2.
  Cases: period total and outcome breakdown prove the placeholder and the old
  row are skipped and the state mapping; env_kind and environment breakdowns
  prove the production split.
bronze:
  bronze_bitbucket_cloud.deployments:
    - $ref: ../templates/bitbucket_ci.yaml#/templates/deployment
    - $ref: ../templates/bitbucket_ci.yaml#/templates/deployment
    - $ref: ../templates/bitbucket_ci.yaml#/templates/deployment
      unique_key: bb-dep-2
      uuid: "{dep-2}"
      state_status: FAILED
      environment_uuid: "{env-staging}"
      environment_name: Staging
      environment_type: Staging
      created_on: "2026-03-02T12:00:00.000000Z"
      last_update_time: "2026-03-02T12:05:00.000000Z"
    - $ref: ../templates/bitbucket_ci.yaml#/templates/deployment
      unique_key: bb-dep-3
      uuid: "{dep-3}"
      state_name: IN_PROGRESS
      state_status: ""
      version: 2
      environment_uuid: "{env-test}"
      environment_name: Test
      environment_type: Test
      created_on: "2026-03-03T12:00:00.000000Z"
      last_update_time: "2026-03-03T12:01:00.000000Z"
    - $ref: ../templates/bitbucket_ci.yaml#/templates/deployment
      unique_key: bb-dep-4
      uuid: "{dep-4}"
      state_status: STOPPED
      created_on: "2026-03-04T12:00:00.000000Z"
      last_update_time: "2026-03-04T12:02:00.000000Z"
    - $ref: ../templates/bitbucket_ci.yaml#/templates/deployment
      unique_key: bb-dep-5
      uuid: "{dep-5}"
