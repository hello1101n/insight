description: >
  Metric: ci.gate_pass_rate — share of commit-triggered CI runs that passed,
  from Bitbucket Pipelines (tenant-grain). ci.runs, ci.gate_retry_share and
  ci.gate_first_try_pass_rate read the same seed.
  How it's computed (bronze → silver → gold):
    • bronze: Bitbucket pipelines, one row per pipeline holding its latest
      run; a rerun keeps the pipeline and raises its run counter
    • silver: each run attempt is its own row; a push that built a pull
      request is the pull_request trigger; a run paused on a manual step
      passed; an expired run timed out; a halted or pending run is undecided
    • gold:   a rerun pipeline counts once, at its last attempt, dated at
      that attempt's start; pass rate = passed gate runs / gate runs, where
      the gate is a push or pull_request run with a decided outcome

  Seeded runs on branches:main: success (plus an exact re-sync duplicate),
  failure, error (synced before the run start was kept), paused on a manual
  step, a pipeline rerun on Mar 02 that failed then passed, and an expired
  run; one pull-request run that passed; one tag push that passed → gate 8,
  passed 5 → 62.5%. A schedule run, a manual run, an on-demand run and a
  stopped push are decided outside the gate; a halted and a pending push are
  undecided and appear nowhere. A passed push stored before connector 7.11.0
  has no selector and appears nowhere until a sync reads it again.
  Cases: gate definition and per-pipeline split (62.5%; main 50%, the
  pull-request and tag pipelines 100%); runs by trigger and the rerun dated
  at its last start; the rerun is a retry and not a first-try pass.
