{{- if .Values.ingestion.templates.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: insight-sync-limits
  labels:
    {{- include "insight.labels" . | nindent 4 }}
data:
  syncs: {{ int64 .Values.ingestion.maxConcurrentSyncs | quote }}
  bronze: {{ .Values.ingestion.maxConcurrentBronzeLoads | quote }}
  checks: {{ .Values.ingestion.maxConcurrentConnectorChecks | quote }}
{{- end }}
