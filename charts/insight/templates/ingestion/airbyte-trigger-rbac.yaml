{{- if .Values.ingestion.templates.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "insight.fullname" . }}-airbyte-trigger
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "insight.fullname" . }}-airbyte-trigger
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, patch]
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "insight.fullname" . }}-airbyte-trigger
subjects:
  - kind: ServiceAccount
    name: {{ include "insight.fullname" . }}-airbyte-trigger
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "insight.fullname" . }}-airbyte-trigger
{{- end }}
