version: 1
defaults:
  timeout_ms: 30000
  strip_prefix: false
  websocket: false
  strip_request_headers:
    - X-Real-IP
    - Forwarded
routes:
  - prefix: /api/analytics
    upstream: http://analytics.insight.svc.cluster.local:8081
    timeout_ms: 60000
    strip_prefix: false

  - prefix: /api/identity
    upstream: http://identity.insight.svc.cluster.local:8082

  - prefix: /api/v1/stream
    upstream: http://analytics.insight.svc.cluster.local:8081
    websocket: true
    timeout_ms: 0

  - prefix: /api/sql/query
    upstream: http://analytics.insight.svc.cluster.local:8086
    auth: sql_token
    timeout_ms: 40000

  - prefix: /api/authenticator
    upstream: http://authenticator.insight.svc.cluster.local:8083
    strip_prefix: true
