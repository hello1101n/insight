{{- if (.Values.seed).tenantDefaultId }}
{{- fail "identityResolution.seed.tenantDefaultId is removed (seed.tenantDefaultId when this chart is installed on its own): the seed reads its tenant only from its config Secret. In the insight chart set authenticator.oidc.defaultTenantId; standalone, put APP__gears__identity_resolution__config__tenant_default_id in existingSecret. Then delete the key." }}
{{- end }}
{{- if .Values.seed.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "insight-identity-resolution.fullname" . }}-seed
  labels:
    {{- include "insight-identity-resolution.labels" . | nindent 4 }}
    app.kubernetes.io/component: persons-seed
spec:
  schedule: {{ .Values.seed.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.seed.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.seed.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: identity-resolution-seed
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: persons-seed
        spec:
          {{- with .Values.global }}
          {{- with .imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: persons-seed
              image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/app/identity-resolution"]
              args: ["-c", "/app/config/insight.yaml", "seed", "--busy-ok", "--guard-ok"]
              volumeMounts:
                - name: identity-resolution-config
                  mountPath: /app/config/insight.yaml
                  subPath: insight.yaml
                  readOnly: true
                # The gears host creates `server.home_dir` at boot; the `seed`
                # subcommand never starts grpc-hub, so /app/data is the only
                # writable path it needs under a read-only root.
                - name: data
                  mountPath: /app/data
              envFrom:
                - configMapRef:
                    name: {{ .Release.Name }}-platform
                    optional: true
                - secretRef:
                    name: {{ required "existingSecret is required (umbrella provides `insight-identity-resolution-config`; standalone installs supply their own)" .Values.existingSecret | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.seed.resources | nindent 16 }}
          volumes:
            - name: identity-resolution-config
              configMap:
                name: {{ include "insight-identity-resolution.fullname" . }}-gears-config
            - name: data
              emptyDir: {}
{{- end }}
