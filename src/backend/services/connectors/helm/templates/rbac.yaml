{{- define "insight-connectors.rbac" -}}
{{- if .Values.cluster.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "insight-connectors.fullname" . }}
  labels:
    {{- include "insight-connectors.labels" . | nindent 4 }}
rules:
  - apiGroups: [argoproj.io]
    resources: [cronworkflows]
    verbs: [get, list, watch, patch]
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [list, watch, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  {{- if eq (.Values.runHistory.airbyteNamespace | default .Release.Namespace) .Release.Namespace }}
  {{- with .Values.runHistory.airbyteReader.secret }}
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ . | quote }}]
    verbs: [get]
  {{- end }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "insight-connectors.fullname" . }}
  labels:
    {{- include "insight-connectors.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "insight-connectors.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "insight-connectors.fullname" . }}
{{- $airbyte := .Values.runHistory.airbyteNamespace | default .Release.Namespace }}
{{- if ne $airbyte .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ $airbyte }}
  name: {{ .Release.Namespace }}-{{ include "insight-connectors.fullname" . }}-observer
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  {{- with .Values.runHistory.airbyteReader.secret }}
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ . | quote }}]
    verbs: [get]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: {{ $airbyte }}
  name: {{ .Release.Namespace }}-{{ include "insight-connectors.fullname" . }}-observer
subjects:
  - kind: ServiceAccount
    name: {{ include "insight-connectors.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Namespace }}-{{ include "insight-connectors.fullname" . }}-observer
{{- end }}
{{- end }}
{{- end }}
{{- if not .Values.infraFromUmbrella }}
{{ include "insight-connectors.rbac" . }}
{{- end }}
