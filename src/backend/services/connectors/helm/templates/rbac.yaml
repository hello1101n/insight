{{- define "insight-connectors.rbac" -}}
{{- if .Values.cluster.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "insight-connectors.fullname" . }}
  labels:
    {{- include "insight-connectors.labels" . | nindent 4 }}
rules:
  - apiGroups: [argoproj.io]
    resources: [cronworkflows]
    verbs: [get, list, watch, patch]
  {{- if .Values.stageAdmission.enabled }}
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  {{- if eq (.Values.stageAdmission.airbyteNamespace | default .Release.Namespace) .Release.Namespace }}
  {{- with .Values.stageAdmission.airbyteReader.secret }}
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ . | quote }}]
    verbs: [get]
  {{- end }}
  {{- end }}
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "insight-connectors.fullname" . }}
  labels:
    {{- include "insight-connectors.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "insight-connectors.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "insight-connectors.fullname" . }}
{{- if .Values.stageAdmission.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ include "insight-connectors.fullname" . }}-admission
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ include "insight-connectors.fullname" . }}-admission
subjects:
  - kind: ServiceAccount
    name: {{ include "insight-connectors.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ include "insight-connectors.fullname" . }}-admission
{{- $airbyte := .Values.stageAdmission.airbyteNamespace | default .Release.Namespace }}
{{- if ne $airbyte .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ $airbyte }}
  name: {{ .Release.Namespace }}-{{ include "insight-connectors.fullname" . }}-observer
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  {{- with .Values.stageAdmission.airbyteReader.secret }}
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ . | quote }}]
    verbs: [get]
  {{- end }}
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: {{ $airbyte }}
  name: {{ .Release.Namespace }}-{{ include "insight-connectors.fullname" . }}-observer
subjects:
  - kind: ServiceAccount
    name: {{ include "insight-connectors.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Namespace }}-{{ include "insight-connectors.fullname" . }}-observer
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if not .Values.infraFromUmbrella }}
{{ include "insight-connectors.rbac" . }}
{{- end }}
