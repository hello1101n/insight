apiVersion: v1
kind: Service
metadata:
  name: {{ include "insight-connectors.fullname" . }}
  labels:
    {{- include "insight-connectors.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.stageAdmission.enabled }}
    - port: 8089
      targetPort: admission
      protocol: TCP
      name: admission
    {{- end }}
  selector:
    {{- include "insight-connectors.selectorLabels" . | nindent 4 }}
