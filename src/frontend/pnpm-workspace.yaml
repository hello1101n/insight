packages:
  - "."
  - "vendor/*"

# Minimum number of minutes that must pass after a version is published before pnpm will install it.
# This applies to all dependencies, including transitive ones.
minimumReleaseAge: 10080

# Constructor's own packages; the quarantine only delays our own releases.
minimumReleaseAgeExclude:
  - '@gears-frontx/*'

# Save exact versions when installing dependencies.
saveExact: true

engineStrict: true

# Refuse git and tarball sources in transitive dependencies.
blockExoticSubdeps: true

# Refuse a version that is published with less trust evidence than an earlier version.
trustPolicy: no-downgrade

# Transitive pins for advisories with no fixed release from the direct dependency
# yet. exceljs 4.4.0 still asks for the vulnerable ranges.
