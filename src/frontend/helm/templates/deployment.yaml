apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insight-frontend.fullname" . }}
  labels:
    {{- include "insight-frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "insight-frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "insight-frontend.selectorLabels" . | nindent 8 }}
      # WORKAROUND: `subPath` mounts never refresh in place, so a config change must roll the pod.
      {{- $checksum := dict "checksum/runtime-config" (include (print $.Template.BasePath "/configmap.yaml") . | sha256sum) }}
      annotations:
        {{- toYaml (merge $checksum (default dict .Values.podAnnotations)) | nindent 8 }}
    spec:
      {{- with .Values.global }}
      {{- with .imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      # WORKAROUND: kubelet otherwise injects Docker-link env vars for every Service in the namespace.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: frontend
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SENTRY_CONNECT_SRC
              value: {{ .Values.sentry.connectSrc | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # WORKAROUND: nginx-unprivileged writes its pid and temp paths under /tmp.
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: runtime-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
        - name: runtime-config
          configMap:
            name: {{ include "insight-frontend.fullname" . }}-runtime
