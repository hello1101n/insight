[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-ingestion-scripts"
version = "0.1.0"
description = "Deploy-time ClickHouse schema tooling shipped in the ingestion toolbox image"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = [
    "airbyte_auth",
    "airbyte_launch",
    "airbyte_sync_poll",
    "airbyte_sync_trigger",
    "data_quality_findings",
    "dbt_completed",
    "dbt_profiles",
    "insight_logging",
    "load_field_value_map",
]
packages = ["tenant_migration"]

[tool.setuptools.package-data]
tenant_migration = ["history-tables.txt"]
