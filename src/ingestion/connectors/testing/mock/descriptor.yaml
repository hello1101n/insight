name: mock
type: nocode
# 1.1.0: every stream stamps its tenant as `insight_tenant_id`, not `tenant_id`.
# MINOR per ADR-0015: reconcile republishes the manifest and refreshes the
# catalog, and `tenant_migration` renames the column of stored Bronze first.
version: "1.1.0"
schedule: "0 4 * * *"
workflow: sync
dbt_select: "tag:mock+"
connection:
  namespace: bronze_mock
secret:
  required_fields:
    - base_url
    - api_token
