version: 2

sources:
  - name: bronze_slack
    # Source freshness (TAF #1322). WINDOWED connector — Slack
    # admin.analytics.getFile re-emits a fixed window each sync, so
    # _airbyte_extracted_at tracks sync liveness, not data freshness. Anchor on
    # the report's `date` (column verified in ClickHouse; windowed behavior
    # inferred — no live rows in Eternal). report_extended tier: Slack analytics
    # has a documented ~3-day publish lag (up to 5 during Slack maintenance).
    freshness:
      warn_after: {count: 120, period: hour}
      error_after: {count: 168, period: hour}
    # `date` is String 'YYYY-MM-DD'; parse for the freshness timestamp compare.
    loaded_at_field: parseDateTimeBestEffortOrNull(date)
    schema: bronze_slack
    tables:
      - name: users_details
      - name: users
        # users.list has no day: each sync replaces every member row.
        freshness: null
      - name: messages

models:
  - name: slack__users_latest
    description: >
      One row per Slack member (insight_tenant_id, source_id, user_id), built from the
      Activity file (bronze_slack.users_details) and the Members list
      (bronze_slack.users). The Activity email wins; the Members email is the
      fallback. Bots and proven guests are left out. Feeds slack__users_snapshot.
    columns:
      - name: insight_tenant_id
        description: "The canonical tenant UUID, checked by bronze_tenant(); never NULL or empty."
        tests:
          - not_null
          - not_empty
      - name: source_id
        description: "The raw source string from bronze insight_source_id."
        tests:
          - not_null
      - name: user_id
        description: "The Slack member ID."
        tests:
          - not_null
      - name: email
        description: "The email of the latest Activity row, else the Members email. NULL when neither has one."
      - name: display_name
        description: "The first non-empty value of Members real_name and display_name. NULL without a Members row."
      - name: unique_key
        tests:
          - not_null
          - unique

  - name: slack__users_snapshot
    description: "SCD2 snapshot of slack__users_latest. A new version is written when email or display_name changes."
    columns:
      - name: insight_tenant_id
        tests:
          - not_null
          - not_empty
      - name: source_id
        tests:
          - not_null
      - name: unique_key
        tests:
          - not_null

  - name: slack__users_fields_history
    description: "Field-level change log of slack__users_snapshot (user_id, email, display_name). entity_id is the Slack member ID."
    columns:
      - name: entity_id
        tests:
          - not_null
      - name: insight_tenant_id
        tests:
          - not_null
          - not_empty
      - name: source_id
        tests:
          - not_null

  - name: slack__identity_inputs
    description: >
      Identity observations for the Slack account (slack, insight_source_id,
      user_id): the email, the display_name and the ADR-0002 id binding row.
      A deactivated member keeps its binding. Unioned into silver.identity_inputs.
    columns:
      - name: unique_key
        tests:
          - not_null
          - unique
      - name: insight_source_type
        tests:
          - accepted_values:
              arguments:
                values: ['slack']
      - name: source_account_id
        tests:
          - not_null
      - name: value_type
        tests:
          - accepted_values:
              arguments:
                values: ['id', 'email', 'display_name']

  - name: slack__collab_chat_activity
    description: "Slack daily chat activity per user (admin.analytics.getFile). Feeds silver.class_collab_chat_activity."
    columns:
      - name: insight_tenant_id
        tests:
          - not_null
          - not_empty
      - name: insight_source_id
        tests:
          - not_null
      - name: unique_key
        tests:
          - not_null
          - unique
      - name: person_key
        tests:
          - not_null
      - name: date
        tests:
          - not_null
      - name: data_source
        tests:
          - not_null
      - name: account_source_type
        description: "Always 'slack': the Slack account resolves the row first, the email of the day is the fallback"
        tests:
          - accepted_values:
              arguments:
                values: ['slack']
      - name: account_source_id
        description: "The raw insight_source_id of the Slack workspace"
        tests:
          - not_null
      - name: account_id
        description: "The Slack user_id. It does not change when the email of the member changes."
        tests:
          - not_null

  - name: slack__collab_chat_activity_messages
    description: "Slack daily chat activity per user on Free and Pro, from message history (bronze_slack.messages). Same columns and measures as slack__collab_chat_activity. Feeds silver.class_collab_chat_activity."
    columns:
      - name: insight_tenant_id
        tests:
          - not_null
          - not_empty
      - name: insight_source_id
        tests:
          - not_null
      - name: unique_key
        tests:
          - not_null
          - unique
      - name: person_key
        tests:
          - not_null
      - name: date
        tests:
          - not_null
      - name: data_source
        tests:
          - not_null
      - name: account_source_type
        description: "Always 'slack': the Slack account resolves the row first, the email of the day is the fallback"
        tests:
          - accepted_values:
              arguments:
                values: ['slack']
      - name: account_source_id
        description: "The raw insight_source_id of the Slack workspace"
        tests:
          - not_null
      - name: account_id
        description: "The Slack user_id. It does not change when the email of the member changes."
        tests:
          - not_null
