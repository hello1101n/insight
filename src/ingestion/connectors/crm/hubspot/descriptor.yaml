name: hubspot
# MAJOR per ADR-0015: the one-shot dbt --full-refresh it dispatches is what
#   fills the new class_crm_* columns for rows stored before them.
# 3.9.0: tickets and their property history also feed the support classes
#   (dim_support_ticket, class_support_activity). MINOR: new staging models
#   build whole on their first run; nothing already stored changes meaning.
# 3.11.0: the support models move to the class_support_* contract. MINOR:
#   new staging tables that each run rebuilds whole; the old support classes
#   and their models are dropped by the deploy hook.
# Property selection: the connector requests only its curated properties and
#   the `collect` list of hubspot_property_selection, and never a property that
#   holds money (source_hubspot/selection.py). The money columns stay in the
#   schema and are NULL. property_definitions gets a `selection` column; the
#   destination adds it on the next sync, so no full refresh is needed.
# 3.15.0: every stream stamps its source as `insight_source_id`, not `source_id`.
# MINOR per ADR-0015: reconcile republishes the connector and refreshes the
# catalog, and `tenant_migration` renames the column of stored Bronze first.
version: "3.16.0"
type: cdk
schedule: "0 6 * * *"
workflow: sync
# CI build metadata + runtime image refs (ADR-0016). CI scans `images:`
# via dynamic discovery on every run; reconcile reads images.cdk.image
# when registering the Airbyte CDK source definition.
images:
  cdk:
    name: source-hubspot-insight
    dockerfile: ./Dockerfile
    context: .
    image: "ghcr.io/hello1101n/source-hubspot-insight:2026.11.28.15.43-4007598"
dbt_select: "tag:hubspot+"
connection:
  namespace: "bronze_hubspot"
secret:
  required_fields:
    - hubspot_access_token
# Non-secret source config fields that the reconciler reads from the settings
# ConfigMap of the instance (same annotations as the Secret).
settings:
  fields:
    - hubspot_property_selection
