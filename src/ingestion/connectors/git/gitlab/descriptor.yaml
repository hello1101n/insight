# Strict semver per ADR-0015. 4.0.0: declarative connector on the git-cli-proxy
# replaces the CDK source. Every stream, column and key changes shape, so the
# major bump dispatches the scoped `dbt --full-refresh` that rebuilds the
# staging models; bronze tables the CDK connector wrote carry a different
# contract and are dropped before the first sync.
name: gitlab
# 4.1.0: connections carry destinationSyncMode append_dedup with
#   primaryKey unique_key, so the Airbyte destination owns the bronze table
#   shape and the RMT promotion step is gone (#2877). MINOR per ADR-0015:
#   reconcile must republish this connector so the connection catalog is
#   refreshed; nothing already stored changes meaning.
# 4.2.0: new `jobs` stream — every build and trigger job of each pipeline.
#   MINOR per ADR-0015: additive bronze table; reconcile must republish
#   this connector so the connection catalog includes the stream.
# 4.3.0: every stream stamps its tenant as `insight_tenant_id`, not `tenant_id`.
# MINOR per ADR-0015: reconcile republishes the manifest and refreshes the
# catalog, and `tenant_migration` renames the column of stored Bronze first.
# 4.4.0: every stream stamps its source as `insight_source_id`, not `source_id`.
# MINOR per ADR-0015: reconcile republishes the connector and refreshes the
# catalog, and `tenant_migration` renames the column of stored Bronze first.
version: "4.4.0"
schedule: "0 2 * * *"
workflow: sync

# Silver routing via dbt tags on the staging models. The connector slug is
# the dbt tag, and the pipeline's silver step hardcodes `tag:<slug>+`.
dbt_select: "tag:gitlab+"

platform_config:
  git_proxy: true

secret:
  # The pre-flight Secret validator reads this list and nothing else, so it
  # carries every field the operator must supply — the proxy address and token
  # are not among them, because platform_config.git_proxy injects those.
  required_fields:
    - gitlab_url
    - gitlab_token
    - gitlab_start_date

connection:
  namespace: bronze_gitlab
