name: bamboohr
type: cdk
# 2.9.0: connections carry destinationSyncMode append_dedup with
#   primaryKey unique_key, so the Airbyte destination owns the bronze table
#   shape and the RMT promotion step is gone (#2877). MINOR per ADR-0015:
#   reconcile must republish this connector so the connection catalog is
#   refreshed; nothing already stored changes meaning.
# 2.22.0: every stream stamps its source as `insight_source_id`, not `source_id`.
# MINOR per ADR-0015: reconcile republishes the connector and refreshes the
# catalog, and `tenant_migration` renames the column of stored Bronze first.
version: "2.23.0"
schedule: 0 * * * *
dbt_select: tag:bamboohr+
workflow: sync
# CI build metadata + runtime image ref (ADR-0016). bump-descriptors keeps
# images.cdk.image pinned to the tag built by each main run; reconcile
# WARN+skips this connector whenever the ref is empty.
images:
  cdk:
    name: source-bamboohr-insight
    dockerfile: ./Dockerfile
    context: .
    image: "ghcr.io/hello1101n/source-bamboohr-insight:2026.11.28.15.43-4007598"
connection:
  namespace: bronze_bamboohr
secret:
  required_fields:
    - bamboohr_api_key
    - bamboohr_domain
