# Zendesk Support connector. Design: docs/domain/support/specs/DESIGN.md.
# 3.0.0: rewritten — OAuth client credentials, whole objects in bronze, the
#   bulk ticket-event export, SLA, both CSAT generations and dictionaries.
#   MAJOR: every bronze stream and model is new; reconcile republishes the
#   connection and dispatches a dbt --full-refresh.
name: zendesk
# 3.1.0: every stream stamps its tenant as `insight_tenant_id`, not `tenant_id`.
# MINOR per ADR-0015: reconcile republishes the manifest and refreshes the
# catalog, and `tenant_migration` renames the column of stored Bronze first.
# 3.2.0: every stream stamps its source as `insight_source_id`, not `source_id`.
# MINOR per ADR-0015: reconcile republishes the connector and refreshes the
# catalog, and `tenant_migration` renames the column of stored Bronze first.
version: "3.2.0"
type: nocode
schedule: "0 5 * * *"
workflow: sync
dbt_select: "tag:zendesk+"

connection:
  namespace: "bronze_zendesk"

secret:
  required_fields:
    - zendesk_subdomain
    - zendesk_client_id
    - zendesk_secret
  optional_fields:
    - zendesk_start_date
    - zendesk_jira_external_id
