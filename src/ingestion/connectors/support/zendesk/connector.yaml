# Airbyte declarative source for Zendesk Support.
# Design: docs/domain/support/specs/DESIGN.md §3. Bronze keeps each API object
# whole in `payload_json`; staging parses it.

version: "7.0.4"
type: DeclarativeSource

definitions:
  error_handler: &error_handler
    type: DefaultErrorHandler
    backoff_strategies:
      - type: WaitTimeFromHeader
        header: Retry-After
    response_filters:
      - type: HttpResponseFilter
        action: RATE_LIMITED
        http_codes: [429, 503]
      - type: HttpResponseFilter
        action: FAIL
        http_codes: [401, 403]
        error_message: "Zendesk rejected the request: check zendesk_client_id and zendesk_secret, that the OAuth client allows the read scope, and that it was created by an administrator."

  # SAFETY: a 404 on an optional product (survey CSAT, Help Center) means the
  # account does not run it; the stream is empty, the sync continues.
  optional_product_error_handler: &optional_product_error_handler
    type: DefaultErrorHandler
    backoff_strategies:
      - type: WaitTimeFromHeader
        header: Retry-After
    response_filters:
      - type: HttpResponseFilter
        action: IGNORE
        http_codes: [404]
      - type: HttpResponseFilter
        action: RATE_LIMITED
        http_codes: [429, 503]
      - type: HttpResponseFilter
        action: FAIL
        http_codes: [401, 403]
        error_message: "Zendesk rejected the request: check zendesk_client_id and zendesk_secret, that the OAuth client allows the read scope, and that it was created by an administrator."

  # The token lives 30 minutes and has no refresh token; a new one is
  # requested before it expires.
  authenticator: &authenticator
    type: SessionTokenAuthenticator
    login_requester:
      type: HttpRequester
      url_base: "https://{{ config['zendesk_subdomain'] }}.zendesk.com/"
      path: oauth/tokens
      http_method: POST
      request_body:
        type: RequestBodyUrlEncodedForm
        value:
          grant_type: client_credentials
          client_id: "{{ config['zendesk_client_id'] }}"
          client_secret: "{{ config['zendesk_secret'] }}"
          scope: read
    session_token_path: [access_token]
    expiration_duration: PT25M
    request_authentication:
      type: Bearer

  requester: &requester
    type: HttpRequester
    url_base: "https://{{ config['zendesk_subdomain'] }}.zendesk.com/api/v2/"
    http_method: GET
    authenticator: *authenticator
    error_handler: *error_handler

  stamp: &stamp
    - type: AddedFieldDefinition
      path: [tenant_id]
      value: "{{ config['insight_tenant_id'] }}"
    - type: AddedFieldDefinition
      path: [source_id]
      value: "{{ config['insight_source_id'] }}"
    - type: AddedFieldDefinition
      path: [unique_key]
      value: "{{ config['insight_tenant_id'] }}-{{ config['insight_source_id'] }}-{{ record['id'] }}"

  payload: &payload
    type: AddFields
    fields:
      - type: AddedFieldDefinition
        path: [payload_json]
        value: "{{ record | tojson }}"
        value_type: string

  # Shared by every list stream that speaks Zendesk cursor pagination.
  cursor_paginator: &cursor_paginator
    type: DefaultPaginator
    pagination_strategy:
      type: CursorPagination
      cursor_value: "{{ response.get('meta', {}).get('after_cursor', '') }}"
      stop_condition: "{{ response.get('meta', {}).get('has_more') == False or last_page_size == 0 or not response.get('meta', {}).get('after_cursor') }}"
    page_token_option:
      type: RequestOption
      field_name: "page[after]"
      inject_into: request_parameter

  # Cursor exports (tickets, users): page 2+ is the whole `after_url`.
  export_cursor_paginator: &export_cursor_paginator
    type: DefaultPaginator
    pagination_strategy:
      type: CursorPagination
      cursor_value: "{{ response.get('after_url', '') }}"
      stop_condition: "{{ response.get('end_of_stream', False) == True or not response.get('after_url') }}"
    page_token_option:
      type: RequestPath

  # Time-based exports: page 2+ is the whole `next_page`.
  export_time_paginator: &export_time_paginator
    type: DefaultPaginator
    pagination_strategy:
      type: CursorPagination
      cursor_value: "{{ response.get('next_page') or '' }}"
      stop_condition: "{{ response.get('end_of_stream', False) == True or not response.get('next_page') or last_page_size == 0 }}"
    page_token_option:
      type: RequestPath

  start_datetime: &start_datetime
    type: MinMaxDatetime
    datetime: "{{ config.get('zendesk_start_date') or '2007-01-01' }}"
    datetime_format: "%Y-%m-%d"

  end_datetime: &end_datetime
    type: MinMaxDatetime
    datetime: "{{ now_utc().strftime('%Y-%m-%dT%H:%M:%SZ') }}"
    datetime_format: "%Y-%m-%dT%H:%M:%SZ"

  iso_formats: &iso_formats
    - "%Y-%m-%dT%H:%M:%SZ"
    - "%Y-%m-%dT%H:%M:%S.%fZ"

  # INVARIANT: every export re-reads one day behind its state. The exports are
  # eventually consistent at the boundary; bronze dedup absorbs the overlap.
  lookback: &lookback "P1D"

  base_properties: &base_properties
    tenant_id: { type: string }
    source_id: { type: string }
    unique_key: { type: string }
    payload_json: { type: string }

check:
  type: CheckStream
  stream_names:
    - zendesk_ticket_fields

streams:
  - type: DeclarativeStream
    name: zendesk_tickets
    primary_key: [unique_key]
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/schema#
        type: object
        additionalProperties: true
        required: [unique_key]
        properties:
          <<: *base_properties
          id: { type: integer }
          updated_at: { type: string }
    retriever:
      type: SimpleRetriever
      requester:
        <<: *requester
        # WORKAROUND: start_time rides in the path because page 2+ replaces the
        # whole path with after_url; a None query parameter renders as "None".
        path: "incremental/tickets/cursor.json?start_time={{ stream_interval['start_time'] }}&include=metric_sets&support_type_scope=all&per_page=1000"
      record_selector:
        type: RecordSelector
        extractor: { type: DpathExtractor, field_path: [tickets] }
      paginator: *export_cursor_paginator
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: updated_at
      cursor_datetime_formats: *iso_formats
      datetime_format: "%s"
      lookback_window: *lookback
      start_datetime: *start_datetime
      end_datetime: *end_datetime
    transformations:
      - *payload
      - type: AddFields
        fields: *stamp

  - type: DeclarativeStream
    name: zendesk_ticket_events
    primary_key: [unique_key]
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/schema#
        type: object
        additionalProperties: true
        required: [unique_key]
        properties:
          <<: *base_properties
          id: { type: integer }
          ticket_id: { type: integer }
          timestamp: { type: integer }
    retriever:
      type: SimpleRetriever
      requester:
        <<: *requester
        path: "incremental/ticket_events.json?start_time={{ stream_interval['start_time'] }}&include=comment_events"
      record_selector:
        type: RecordSelector
        extractor: { type: DpathExtractor, field_path: [ticket_events] }
      paginator: *export_time_paginator
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: timestamp
      cursor_datetime_formats: ["%s"]
      datetime_format: "%s"
      lookback_window: *lookback
      start_datetime: *start_datetime
      end_datetime: *end_datetime
    transformations:
      - *payload
      - type: AddFields
        fields: *stamp

  - type: DeclarativeStream
    name: zendesk_ticket_metric_events
    primary_key: [unique_key]
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/schema#
        type: object
        additionalProperties: true
        required: [unique_key]
        properties:
          <<: *base_properties
          id: { type: integer }
          ticket_id: { type: integer }
          time: { type: string }
    retriever:
      type: SimpleRetriever
      requester:
        <<: *requester
        path: "incremental/ticket_metric_events.json?start_time={{ stream_interval['start_time'] }}"
      record_selector:
        type: RecordSelector
        extractor: { type: DpathExtractor, field_path: [ticket_metric_events] }
      paginator: *export_time_paginator
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: time
      cursor_datetime_formats: *iso_formats
      datetime_format: "%s"
      lookback_window: *lookback
      start_datetime: *start_datetime
      end_datetime: *end_datetime
    transformations:
      - *payload
      - type: AddFields
        fields: *stamp

  - type: DeclarativeStream
    name: zendesk_users
    primary_key: [unique_key]
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/schema#
        type: object
        additionalProperties: true
        required: [unique_key]
        properties:
          <<: *base_properties
          id: { type: integer }
          updated_at: { type: string }
    retriever:
      type: SimpleRetriever
      requester:
        <<: *requester
        path: "incremental/users/cursor.json?start_time={{ stream_interval['start_time'] }}&per_page=1000"
      record_selector:
        type: RecordSelector
        extractor: { type: DpathExtractor, field_path: [users] }
      paginator: *export_cursor_paginator
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: updated_at
      cursor_datetime_formats: *iso_formats
      datetime_format: "%s"
      lookback_window: *lookback
      start_datetime: *start_datetime
      end_datetime: *end_datetime
    transformations:
      - *payload
      - type: AddFields
        fields: *stamp

  - type: DeclarativeStream
    name: zendesk_organizations
    primary_key: [unique_key]
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/schema#
        type: object
        additionalProperties: true
        required: [unique_key]
        properties:
          <<: *base_properties
          id: { type: integer }
          updated_at: { type: string }
    retriever:
      type: SimpleRetriever
      requester:
        <<: *requester
        path: "incremental/organizations.json?start_time={{ stream_interval['start_time'] }}"
      record_selector:
        type: RecordSelector
        extractor: { type: DpathExtractor, field_path: [organizations] }
      paginator: *export_time_paginator
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: updated_at
      cursor_datetime_formats: *iso_formats
      datetime_format: "%s"
      lookback_window: *lookback
      start_datetime: *start_datetime
      end_datetime: *end_datetime
    transformations:
      - *payload
      - type: AddFields
        fields: *stamp

  - type: DeclarativeStream
    name: zendesk_csat_ratings
    primary_key: [unique_key]
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/schema#
        type: object
        additionalProperties: true
        required: [unique_key]
        properties:
          <<: *base_properties
          id: { type: integer }
          ticket_id: { type: ["integer", "null"] }
          created_at: { type: string }
    retriever:
      type: SimpleRetriever
      requester:
        <<: *requester
        path: satisfaction_ratings
        request_parameters:
          page[size]: "100"
      record_selector:
        type: RecordSelector
        extractor: { type: DpathExtractor, field_path: [satisfaction_ratings] }
      paginator: *cursor_paginator
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: created_at
      cursor_datetime_formats: *iso_formats
      datetime_format: "%s"
      lookback_window: *lookback
      start_datetime: *start_datetime
      end_datetime: *end_datetime
      start_time_option:
        type: RequestOption
        field_name: start_time
        inject_into: request_parameter
    transformations:
      - *payload
      - type: AddFields
        fields: *stamp

  - type: DeclarativeStream
    name: zendesk_survey_responses
    primary_key: [unique_key]
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/schema#
        type: object
        additionalProperties: true
        required: [unique_key]
        properties:
          <<: *base_properties
          id: { type: string }
    retriever:
      type: SimpleRetriever
      requester:
        <<: *requester
        path: guide/survey_responses
        error_handler: *optional_product_error_handler
        request_parameters:
          page[size]: "50"
          filter[created_at_start]: "{{ stream_interval['start_time'] }}"
      record_selector:
        type: RecordSelector
        extractor: { type: DpathExtractor, field_path: [survey_responses] }
      paginator: *cursor_paginator
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: updated_at
      cursor_datetime_formats: *iso_formats
      datetime_format: "%ms"
      lookback_window: *lookback
      start_datetime: *start_datetime
      end_datetime: *end_datetime
    transformations:
      - *payload
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path: [updated_at]
            value: "{{ (record.get('answers') or [{}]) | map(attribute='updated_at') | select | max }}"
      - type: AddFields
        fields: *stamp

  - type: DeclarativeStream
    name: zendesk_groups
    primary_key: [unique_key]
    schema_loader: &id_schema
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/schema#
        type: object
        additionalProperties: true
        required: [unique_key]
        properties:
          <<: *base_properties
          id: { type: integer }
    retriever:
      type: SimpleRetriever
      requester:
        <<: *requester
        path: groups
        request_parameters:
          page[size]: "100"
      record_selector:
        type: RecordSelector
        extractor: { type: DpathExtractor, field_path: [groups] }
      paginator: *cursor_paginator
    transformations:
      - *payload
      - type: AddFields
        fields: *stamp

  - type: DeclarativeStream
    name: zendesk_group_memberships
    primary_key: [unique_key]
    schema_loader: *id_schema
    retriever:
      type: SimpleRetriever
      requester:
        <<: *requester
        path: group_memberships
        request_parameters:
          page[size]: "100"
      record_selector:
        type: RecordSelector
        extractor: { type: DpathExtractor, field_path: [group_memberships] }
      paginator: *cursor_paginator
    transformations:
      - *payload
      - type: AddFields
        fields: *stamp

  - type: DeclarativeStream
    name: zendesk_ticket_fields
    primary_key: [unique_key]
    schema_loader: *id_schema
    retriever:
      type: SimpleRetriever
      requester:
        <<: *requester
        path: ticket_fields
        request_parameters:
          page[size]: "100"
      record_selector:
        type: RecordSelector
        extractor: { type: DpathExtractor, field_path: [ticket_fields] }
      paginator: *cursor_paginator
    transformations:
      - *payload
      - type: AddFields
        fields: *stamp

  - type: DeclarativeStream
    name: zendesk_ticket_forms
    primary_key: [unique_key]
    schema_loader: *id_schema
    retriever:
      type: SimpleRetriever
      requester:
        <<: *requester
        path: ticket_forms
      record_selector:
        type: RecordSelector
        extractor: { type: DpathExtractor, field_path: [ticket_forms] }
    transformations:
      - *payload
      - type: AddFields
        fields: *stamp

  - type: DeclarativeStream
    name: zendesk_custom_statuses
    primary_key: [unique_key]
    schema_loader: *id_schema
    retriever:
      type: SimpleRetriever
      requester:
        <<: *requester
        path: custom_statuses
      record_selector:
        type: RecordSelector
        extractor: { type: DpathExtractor, field_path: [custom_statuses] }
    transformations:
      - *payload
      - type: AddFields
        fields: *stamp

  - type: DeclarativeStream
    name: zendesk_brands
    primary_key: [unique_key]
    schema_loader: *id_schema
    retriever:
      type: SimpleRetriever
      requester:
        <<: *requester
        path: brands
        request_parameters:
          page[size]: "100"
      record_selector:
        type: RecordSelector
        extractor: { type: DpathExtractor, field_path: [brands] }
      paginator: *cursor_paginator
    transformations:
      - *payload
      - type: AddFields
        fields: *stamp

  - type: DeclarativeStream
    name: zendesk_sla_policies
    primary_key: [unique_key]
    schema_loader: *id_schema
    retriever:
      type: SimpleRetriever
      requester:
        <<: *requester
        path: slas/policies
      record_selector:
        type: RecordSelector
        extractor: { type: DpathExtractor, field_path: [sla_policies] }
    transformations:
      - *payload
      - type: AddFields
        fields: *stamp

  - type: DeclarativeStream
    name: zendesk_schedules
    primary_key: [unique_key]
    schema_loader: *id_schema
    retriever:
      type: SimpleRetriever
      requester:
        <<: *requester
        path: business_hours/schedules
      record_selector:
        type: RecordSelector
        extractor: { type: DpathExtractor, field_path: [schedules] }
    transformations:
      - *payload
      - type: AddFields
        fields: *stamp

  - type: DeclarativeStream
    name: zendesk_deleted_tickets
    primary_key: [unique_key]
    schema_loader: *id_schema
    retriever:
      type: SimpleRetriever
      requester:
        <<: *requester
        path: deleted_tickets
        request_parameters:
          page[size]: "100"
      record_selector:
        type: RecordSelector
        extractor: { type: DpathExtractor, field_path: [deleted_tickets] }
      paginator: *cursor_paginator
    transformations:
      - *payload
      - type: AddFields
        fields: *stamp

  - type: DeclarativeStream
    name: zendesk_kb_articles
    primary_key: [unique_key]
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/schema#
        type: object
        additionalProperties: true
        required: [unique_key]
        properties:
          <<: *base_properties
          id: { type: integer }
          updated_at: { type: string }
    retriever:
      type: SimpleRetriever
      requester:
        <<: *requester
        path: "help_center/incremental/articles.json?start_time={{ stream_interval['start_time'] }}"
        error_handler: *optional_product_error_handler
      record_selector:
        type: RecordSelector
        extractor: { type: DpathExtractor, field_path: [articles] }
      paginator: *export_time_paginator
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: updated_at
      cursor_datetime_formats: *iso_formats
      datetime_format: "%s"
      lookback_window: *lookback
      start_datetime: *start_datetime
      end_datetime: *end_datetime
    transformations:
      - *payload
      - type: AddFields
        fields: *stamp

  # A merge is named only in the audits of the merged ticket (DESIGN.md §6).
  - type: DeclarativeStream
    name: zendesk_merge_audits
    primary_key: [unique_key]
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/schema#
        type: object
        additionalProperties: true
        required: [unique_key]
        properties:
          <<: *base_properties
          id: { type: integer }
          ticket_id: { type: integer }
          created_at: { type: string }
    retriever:
      type: SimpleRetriever
      requester:
        <<: *requester
        path: "tickets/{{ stream_partition['ticket_id'] }}/audits.json"
      record_selector:
        type: RecordSelector
        extractor: { type: DpathExtractor, field_path: [audits] }
        record_filter:
          type: RecordFilter
          condition: "{{ ((record.get('via') or {}).get('source') or {}).get('rel') == 'merge' }}"
      paginator:
        type: DefaultPaginator
        pagination_strategy:
          type: CursorPagination
          cursor_value: "{{ response.get('next_page') or '' }}"
          stop_condition: "{{ not response.get('next_page') }}"
        page_token_option:
          type: RequestPath
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - type: ParentStreamConfig
            parent_key: id
            partition_field: ticket_id
            incremental_dependency: true
            stream:
              type: DeclarativeStream
              name: _merged_ticket_ids
              primary_key: [id]
              schema_loader:
                type: InlineSchemaLoader
                schema:
                  $schema: http://json-schema.org/schema#
                  type: object
                  additionalProperties: true
                  properties:
                    id: { type: integer }
                    updated_at: { type: string }
              retriever:
                type: SimpleRetriever
                requester:
                  <<: *requester
                  path: search/export.json
                  request_parameters:
                    query: "tags:closed_by_merge updated>={{ stream_interval['start_time'] }}"
                    filter[type]: ticket
                    page[size]: "1000"
                record_selector:
                  type: RecordSelector
                  extractor: { type: DpathExtractor, field_path: [results] }
                paginator: *cursor_paginator
              incremental_sync:
                type: DatetimeBasedCursor
                cursor_field: updated_at
                cursor_datetime_formats: *iso_formats
                datetime_format: "%Y-%m-%d"
                lookback_window: *lookback
                start_datetime: *start_datetime
                end_datetime: *end_datetime
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: created_at
      cursor_datetime_formats: *iso_formats
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      start_datetime: *start_datetime
      end_datetime: *end_datetime
      is_client_side_incremental: true
    transformations:
      - *payload
      - type: AddFields
        fields: *stamp

concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: 4

spec:
  type: Spec
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    required:
      - insight_tenant_id
      - insight_source_id
      - zendesk_subdomain
      - zendesk_client_id
      - zendesk_secret
    properties:
      insight_tenant_id:
        type: string
        title: Insight Tenant ID
        order: 0
      insight_source_id:
        type: string
        title: Source Instance ID
        order: 1
      zendesk_subdomain:
        type: string
        title: Zendesk subdomain
        description: The `{subdomain}` of `{subdomain}.zendesk.com`.
        order: 2
      zendesk_client_id:
        type: string
        title: OAuth client identifier
        description: Identifier of a confidential OAuth client created by an administrator, allowed the `read` scope.
        order: 3
      zendesk_secret:
        type: string
        title: OAuth client secret
        airbyte_secret: true
        order: 4
      zendesk_start_date:
        type: string
        title: Start date
        description: Earliest day to read (YYYY-MM-DD). Empty reads the whole account.
        pattern: "^(\\d{4}-\\d{2}-\\d{2})?$"
        order: 5
    additionalProperties: true

metadata:
  autoImportSchema:
    zendesk_tickets: true
    zendesk_ticket_events: true
    zendesk_ticket_metric_events: true
    zendesk_users: true
    zendesk_organizations: true
    zendesk_csat_ratings: true
    zendesk_survey_responses: true
    zendesk_groups: true
    zendesk_group_memberships: true
    zendesk_ticket_fields: true
    zendesk_ticket_forms: true
    zendesk_custom_statuses: true
    zendesk_brands: true
    zendesk_sla_policies: true
    zendesk_schedules: true
    zendesk_deleted_tickets: true
    zendesk_kb_articles: true
    zendesk_merge_audits: true
