      - name: zendesk_kb_articles
      - name: zendesk_merge_audits
      - name: zendesk_jira_links
      - name: zendesk_jira_links_v2

models:
  - name: zendesk__support_agents
    description: "Per-source staging projection of Zendesk agents. Unioned into silver.class_support_agents."
    columns:
      - name: insight_tenant_id
        description: "Canonical tenant the row belongs to; never NULL or empty."
        tests:
          - not_null
          - not_empty
